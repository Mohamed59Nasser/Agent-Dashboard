<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quattro Operations Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) for Excel Import/Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Firebase App & Realtime Database SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Modern Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* Theme Config Variables */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-color: #fbbf24;
            --accent-hover: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --badge-admin: #ef4444;
            --badge-leader: #3b82f6;
            --badge-quality: #10b981;
            --badge-agent: #8b5cf6;
        }

        /* Themes Classes */
        .theme-dark-gold {
            --bg-primary: #0b0f19; --bg-secondary: #151d30; --accent-color: #d4af37; --accent-hover: #b8901c;
            --text-primary: #f8fafc; --text-secondary: #94a3b8; --border-color: #24314f;
        }
        .theme-deep-blue {
            --bg-primary: #020617; --bg-secondary: #0f172a; --accent-color: #3b82f6; --accent-hover: #1d4ed8;
            --text-primary: #f1f5f9; --text-secondary: #64748b; --border-color: #1e293b;
        }
        .theme-emerald {
            --bg-primary: #022c22; --bg-secondary: #064e3b; --accent-color: #10b981; --accent-hover: #059669;
            --text-primary: #ecfdf5; --text-secondary: #a7f3d0; --border-color: #065f46;
        }
        .theme-ruby {
            --bg-primary: #1c050a; --bg-secondary: #360b14; --accent-color: #e11d48; --accent-hover: #be123c;
            --text-primary: #fff1f2; --text-secondary: #fda4af; --border-color: #4c0d18;
        }
        .theme-light {
            --bg-primary: #f8fafc; --bg-secondary: #ffffff; --accent-color: #4f46e5; --accent-hover: #4338ca;
            --text-primary: #0f172a; --text-secondary: #475569; --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
        }
        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }
        .accent-btn {
            background-color: var(--accent-color);
            color: #000 !important;
            font-weight: 600;
        }
        .accent-btn:hover { background-color: var(--accent-hover); }
        .text-accent { color: var(--accent-color); }
        .border-accent { border-color: var(--accent-color); }

        /* Custom Checkbox styles for multi-select dropdown */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--bg-secondary);
            min-width: 250px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 50;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }
        .dropdown-content label {
            display: block;
            padding: 8px;
            cursor: pointer;
        }
        .dropdown-content label:hover {
            background-color: var(--border-color);
        }
    </style>
</head>
<body class="theme-dark-gold min-h-screen flex flex-col">

    <!-- TOP HEADER -->
    <header class="card border-b py-4 px-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <span class="text-2xl font-bold tracking-widest text-accent flex items-center gap-2">
                <i class="fa-solid fa-crown"></i> QUATTRO
            </span>
            <span class="text-xs uppercase bg-slate-800 text-slate-300 px-2 py-1 rounded" id="platform-title">Operations</span>
        </div>
        
        <div class="flex items-center gap-4">
            <!-- Theme Trigger -->
            <button onclick="toggleThemeModal()" class="text-xl text-accent hover:scale-110 transition"><i class="fa-solid fa-palette"></i></button>
            <div id="user-display-info" class="hidden flex items-center gap-3">
                <span id="header-user-badge" class="px-2 py-0.5 rounded text-xs font-bold uppercase text-white"></span>
                <span id="header-user-name" class="font-semibold text-sm"></span>
                <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded flex items-center gap-1 font-bold"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow flex flex-col md:flex-row relative">
        <!-- AUTH SECTION -->
        <section id="auth-section" class="w-full max-w-md mx-auto mt-12 p-6 card rounded-lg shadow-xl flex flex-col gap-6">
            <h2 class="text-2xl font-bold text-center text-accent">Sign In to Platform</h2>
            <div class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs uppercase mb-1">Username</label>
                    <input type="text" id="login-username" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="block text-xs uppercase mb-1">Password</label>
                    <input type="password" id="login-password" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-yellow-500">
                </div>
                <button onclick="handleLogin()" class="accent-btn w-full py-2.5 rounded font-bold uppercase tracking-wider transition">Login</button>
                <div class="text-center text-xs text-slate-400">Don't have an account? <button onclick="toggleAuthForms()" class="text-accent underline font-semibold">Register here</button></div>
            </div>
        </section>

        <section id="register-section" class="w-full max-w-md mx-auto mt-12 p-6 card rounded-lg shadow-xl flex flex-col gap-6 hidden">
            <h2 class="text-2xl font-bold text-center text-accent">Create Account</h2>
            <div class="flex flex-col gap-3">
                <div>
                    <label class="block text-xs uppercase mb-0.5">Full Name</label>
                    <input type="text" id="reg-fullname" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase mb-0.5">Username</label>
                    <input type="text" id="reg-username" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase mb-0.5">Password</label>
                    <input type="password" id="reg-password" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase mb-0.5">Email</label>
                    <input type="email" id="reg-email" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase mb-0.5">Phone</label>
                    <input type="text" id="reg-phone" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase mb-0.5">HR ID</label>
                    <input type="text" id="reg-hrid" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none">
                </div>
                <button onclick="handleRegister()" class="accent-btn w-full py-2.5 rounded font-bold uppercase tracking-wider transition">Register</button>
                <div class="text-center text-xs text-slate-400">Already registered? <button onclick="toggleAuthForms()" class="text-accent underline font-semibold">Login here</button></div>
            </div>
        </section>

        <!-- PORTAL INTERFACE (HIDDEN BY DEFAULT) -->
        <section id="portal-section" class="hidden flex-grow flex flex-col md:flex-row w-full">
            <!-- Sidebar Navigation -->
            <nav id="sidebar" class="w-full md:w-64 card border-r p-4 flex flex-col gap-2 shrink-0">
                <div class="text-xs uppercase text-slate-500 font-bold px-2 py-1">Menu Tabs</div>
                <button onclick="switchTab('dashboard')" class="tab-btn flex items-center gap-3 p-2.5 rounded text-left hover:bg-slate-800 transition font-semibold"><i class="fa-solid fa-chart-line"></i> Dashboard</button>
                <button onclick="switchTab('users')" id="tab-users-btn" class="tab-btn flex items-center gap-3 p-2.5 rounded text-left hover:bg-slate-800 transition font-semibold hidden"><i class="fa-solid fa-users"></i> Users Control</button>
                <button onclick="switchTab('comms')" class="tab-btn flex items-center gap-3 p-2.5 rounded text-left hover:bg-slate-800 transition font-semibold"><i class="fa-solid fa-comments"></i> Communications</button>
                <button onclick="switchTab('announcements')" class="tab-btn flex items-center gap-3 p-2.5 rounded text-left hover:bg-slate-800 transition font-semibold"><i class="fa-solid fa-bullhorn"></i> Announcements</button>
                <button onclick="switchTab('schedules')" class="tab-btn flex items-center gap-3 p-2.5 rounded text-left hover:bg-slate-800 transition font-semibold"><i class="fa-solid fa-calendar-days"></i> Schedules & Breaks</button>
                <button onclick="switchTab('quizzes')" class="tab-btn flex items-center gap-3 p-2.5 rounded text-left hover:bg-slate-800 transition font-semibold"><i class="fa-solid fa-graduation-cap"></i> Quizzes</button>
            </nav>

            <!-- Active View Container -->
            <div class="flex-grow p-6 overflow-y-auto" id="content-display">
                <!-- Tabs Content will render here -->
            </div>
        </section>
    </main>

    <!-- ISOLATED FULL-SCREEN QUIZ INTERFACE -->
    <section id="isolated-quiz-container" class="hidden fixed inset-0 z-50 overflow-y-auto bg-slate-950 text-slate-100 flex flex-col">
        <header class="card border-b py-4 px-6 flex justify-between items-center">
            <h2 id="isolated-quiz-title" class="text-2xl font-bold text-accent">Active Quiz</h2>
            <button onclick="exitQuizMode()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded text-sm"><i class="fa-solid fa-circle-xmark"></i> Close & Exit</button>
        </header>
        <div class="flex-grow max-w-4xl mx-auto w-full p-6 flex flex-col gap-6" id="isolated-quiz-body">
            <!-- Dynamically populated quiz questions/options or quiz results review -->
        </div>
    </section>

    <!-- WHATSAPP-STYLE IMAGE PREVIEW MODAL -->
    <div id="image-preview-modal" class="fixed inset-0 z-50 bg-black bg-opacity-95 flex flex-col justify-center items-center hidden p-4">
        <div class="max-w-xl w-full bg-slate-900 border border-slate-700 rounded-lg p-4 flex flex-col gap-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 class="text-lg font-bold text-accent">Image Preview</h3>
                <button onclick="closeImagePreview()" class="text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <img id="preview-image-element" src="" class="max-h-96 object-contain rounded border border-slate-800" alt="Preview">
            <div class="flex justify-end gap-3 mt-2">
                <button onclick="closeImagePreview()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-semibold">Cancel</button>
                <button onclick="submitCompressedImage()" class="px-5 py-2 accent-btn rounded text-sm font-semibold flex items-center gap-2"><i class="fa-solid fa-paper-plane"></i> Send Image</button>
            </div>
        </div>
    </div>

    <!-- USER PROFILE DETAILS POPUP CARD -->
    <div id="user-profile-modal" class="fixed inset-0 z-50 bg-black bg-opacity-75 flex justify-center items-center hidden p-4">
        <div class="max-w-sm w-full bg-slate-900 border border-accent rounded-lg p-6 shadow-2xl relative">
            <button onclick="closeProfileCard()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            <div class="flex flex-col items-center text-center gap-4">
                <div class="w-20 h-20 rounded-full bg-accent flex items-center justify-center text-slate-950 font-bold text-3xl shadow" id="profile-card-avatar">U</div>
                <div class="w-full border-b border-slate-800 pb-3">
                    <h3 id="profile-card-fullname" class="text-xl font-bold text-white">Full Name</h3>
                    <span id="profile-card-role" class="px-3 py-0.5 rounded text-xs font-bold uppercase inline-block mt-1">Role</span>
                </div>
                <div class="w-full flex flex-col gap-2.5 text-left text-sm">
                    <div class="flex justify-between"><span class="text-slate-400">Username:</span> <span id="profile-card-username" class="font-semibold text-slate-200"></span></div>
                    <div class="flex justify-between"><span class="text-slate-400">HR ID:</span> <span id="profile-card-hrid" class="font-semibold text-slate-200"></span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Campaign/Account:</span> <span id="profile-card-account" class="font-semibold text-slate-200"></span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Email:</span> <span id="profile-card-email" class="font-semibold text-slate-200 break-all"></span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Phone:</span> <span id="profile-card-phone" class="font-semibold text-slate-200"></span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- THEME MODAL -->
    <div id="theme-modal" class="fixed inset-0 z-50 bg-black bg-opacity-50 flex justify-center items-center hidden">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-lg max-w-sm w-full flex flex-col gap-4">
            <h3 class="text-lg font-bold text-accent">Select Dashboard Color Theme</h3>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="setTheme('theme-dark-gold')" class="p-3 bg-amber-950/40 border border-yellow-600 rounded text-amber-500 font-bold hover:bg-amber-900/50">Dark Gold</button>
                <button onclick="setTheme('theme-deep-blue')" class="p-3 bg-blue-950/40 border border-blue-600 rounded text-blue-400 font-bold hover:bg-blue-900/50">Deep Blue</button>
                <button onclick="setTheme('theme-emerald')" class="p-3 bg-emerald-950/40 border border-emerald-600 rounded text-emerald-400 font-bold hover:bg-emerald-900/50">Emerald</button>
                <button onclick="setTheme('theme-ruby')" class="p-3 bg-rose-950/40 border border-rose-600 rounded text-rose-400 font-bold hover:bg-rose-900/50">Ruby</button>
                <button onclick="setTheme('theme-light')" class="p-3 bg-slate-200 border border-slate-400 rounded text-indigo-700 font-bold hover:bg-slate-300">Classic Light</button>
            </div>
            <button onclick="toggleThemeModal()" class="mt-2 text-center text-sm text-slate-400 hover:text-white">Cancel</button>
        </div>
    </div>

    <!-- MAIN FOOTER -->
    <footer class="card border-t py-4 px-6 text-center text-xs text-slate-500 mt-auto">
        DEVELOPED BY MOHAMED NASSER · QUATTRO OPERATIONS · <span class="text-accent font-semibold">2026</span>
    </footer>

    <!-- MAIN SCRIPT CONTROLLER -->
    <script>
        // CONFIGURATION NOTE: Replace with your actual Firebase Realtime Database parameters
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyReplaceThisWithYourActualApiKey",
            authDomain: "quattro-operations.firebaseapp.com",
            databaseURL: "https://agent-dashboard-theta-three-default-rtdb.firebaseio.com/",
            projectId: "quattro-operations",
            storageBucket: "quattro-operations.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Local Storage / State Configuration Variables
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        let activeTab = 'dashboard';
        let currentTheme = localStorage.getItem('themeClass') || 'theme-dark-gold';

        // Comms state variables
        let selectedChatId = null;
        let commsUsers = {};
        let activeFilter = 'active'; // active | archived
        let currentCompressedImageBase64 = null;

        // Quiz temp storage for multiple question additions
        let pendingQuizQuestions = [];

        // ON LOAD INITIALIZER
        window.addEventListener('DOMContentLoaded', () => {
            document.body.className = currentTheme;
            if (currentUser) {
                renderPortalInterface();
            } else {
                renderAuthForms();
            }
        });

        // AUTH VISUAL CONTROLLERS
        function renderAuthForms() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('portal-section').classList.add('hidden');
            document.getElementById('user-display-info').classList.add('hidden');
        }

        function toggleAuthForms() {
            const lForm = document.getElementById('auth-section');
            const rForm = document.getElementById('register-section');
            if (lForm.classList.contains('hidden')) {
                lForm.classList.remove('hidden');
                rForm.classList.add('hidden');
            } else {
                lForm.classList.add('hidden');
                rForm.classList.remove('hidden');
            }
        }

        function toggleThemeModal() {
            const modal = document.getElementById('theme-modal');
            modal.classList.toggle('hidden');
        }

        function setTheme(themeName) {
            currentTheme = themeName;
            document.body.className = themeName;
            localStorage.setItem('themeClass', themeName);
            toggleThemeModal();
        }

        // BACKEND AUTH CALLS
        function handleLogin() {
            const user = document.getElementById('login-username').value.trim().toLowerCase();
            const pass = document.getElementById('login-password').value;

            if (!user || !pass) {
                alert('Please enter username and password!');
                return;
            }

            db.ref('users/' + user).once('value', snapshot => {
                const data = snapshot.val();
                if (data && data.password === pass) {
                    if (data.status !== 'approved') {
                        alert('Your account is currently pending approval by an Admin.');
                        return;
                    }
                    currentUser = data;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    renderPortalInterface();
                } else {
                    alert('Invalid Username or Password.');
                }
            });
        }

        function handleRegister() {
            const name = document.getElementById('reg-fullname').value.trim();
            const user = document.getElementById('reg-username').value.trim().toLowerCase();
            const pass = document.getElementById('reg-password').value;
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const hrid = document.getElementById('reg-hrid').value.trim();

            if (!name || !user || !pass || !email || !phone || !hrid) {
                alert('Please fill out all fields completely!');
                return;
            }

            db.ref('users/' + user).once('value', snapshot => {
                if (snapshot.exists()) {
                    alert('Username is already registered!');
                    return;
                }
                const regData = {
                    fullName: name,
                    username: user,
                    password: pass,
                    email: email,
                    phone: phone,
                    hrId: hrid,
                    role: 'Agent',
                    account: 'Default',
                    status: 'pending' // Admin must approve
                };
                db.ref('users/' + user).set(regData)
                    .then(() => {
                        alert('Registration request submitted successfully! Please wait for Admin approval.');
                        toggleAuthForms();
                    });
            });
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            selectedChatId = null;
            
            // Clean up state fields
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            
            // Seamless CSS transform/display trigger without reloading URL
            document.getElementById('portal-section').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('user-display-info').classList.add('hidden');
        }

        // VIEW RENDERING SWITCHER
        function renderPortalInterface() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('portal-section').classList.remove('hidden');
            
            const headInfo = document.getElementById('user-display-info');
            headInfo.classList.remove('hidden');
            document.getElementById('header-user-name').innerText = currentUser.fullName;
            
            const badge = document.getElementById('header-user-badge');
            badge.innerText = currentUser.role;
            if (currentUser.role === 'Admin') badge.className = "px-2 py-0.5 rounded text-xs font-bold uppercase text-white bg-red-600";
            else if (currentUser.role === 'Leader') badge.className = "px-2 py-0.5 rounded text-xs font-bold uppercase text-white bg-blue-600";
            else if (currentUser.role === 'Quality') badge.className = "px-2 py-0.5 rounded text-xs font-bold uppercase text-white bg-emerald-600";
            else badge.className = "px-2 py-0.5 rounded text-xs font-bold uppercase text-white bg-purple-600";

            // Control panel tab views for Admin/Leader/Quality
            const usersBtn = document.getElementById('tab-users-btn');
            if (['Admin', 'Leader', 'Quality'].includes(currentUser.role)) {
                usersBtn.classList.remove('hidden');
            } else {
                usersBtn.classList.add('hidden');
            }

            switchTab('dashboard');
        }

        function switchTab(tabId) {
            activeTab = tabId;
            const container = document.getElementById('content-display');
            container.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-accent"></i></div>`;
            
            // Style active tab button in sidebar
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-slate-800', 'text-accent');
            });
            event?.currentTarget?.classList?.add('bg-slate-800', 'text-accent');

            switch (tabId) {
                case 'dashboard':
                    renderDashboardView(container);
                    break;
                case 'users':
                    renderUsersControlView(container);
                    break;
                case 'comms':
                    renderCommunicationsView(container);
                    break;
                case 'announcements':
                    renderAnnouncementsView(container);
                    break;
                case 'schedules':
                    renderSchedulesView(container);
                    break;
                case 'quizzes':
                    renderQuizzesView(container);
                    break;
            }
        }

        // ==========================================
        // 1. DASHBOARD VIEW CONTROLLER
        // ==========================================
        function renderDashboardView(container) {
            container.innerHTML = `
                <div class="flex flex-col gap-6">
                    <h2 class="text-2xl font-bold">Performance Dashboard</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="card p-6 rounded-lg flex flex-col gap-2">
                            <span class="text-xs uppercase text-slate-400">Campaign / Account</span>
                            <span class="text-2xl font-bold text-accent">${currentUser.account || 'Not Assigned'}</span>
                        </div>
                        <div class="card p-6 rounded-lg flex flex-col gap-2">
                            <span class="text-xs uppercase text-slate-400">HR Identifier ID</span>
                            <span class="text-2xl font-bold text-accent">${currentUser.hrId || 'N/A'}</span>
                        </div>
                        <div class="card p-6 rounded-lg flex flex-col gap-2">

        // BULK IMPORT USERS VIA EXCEL PARSER
        function processUserExcelImport(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet);

                let successCount = 0;
                rows.forEach(row => {
                    // Extracting based on: Full Name | Username | Password | Account | HR ID | Role | Email | Phone
                    const username = (row['Username'] || '').toString().trim().toLowerCase();
                    const fullName = row['Full Name'] || '';
                    const password = (row['Password'] || '123456').toString();
                    const account = row['Account'] || 'Default';
                    const hrid = (row['HR ID'] || '').toString();
                    const role = (row['Role'] || 'Agent').toString().trim();
                    const email = row['Email'] || '';
                    const phone = (row['Phone'] || '').toString();

                    if (username && fullName) {
                        db.ref('users/' + username).set({
                            fullName: fullName,
                            username: username,
                            password: password,
                            account: account,
                            hrId: hrid,
                            role: role,
                            email: email,
                            phone: phone,
                            status: 'approved' // Excel imports approved directly
                        });
                        successCount++;
                    }
                });
                alert(`Successfully imported ${successCount} user accounts into platform database! 🎉`);
                input.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        // IMAGE SHAT PROCESSING WITH COMPRESSION
        function processImageAttachment(input) {
            const file = input.files[0];
            if (!file) return;

            // Trigger JS image downscaler/compressor to keep base64 payload highly responsive
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const max_width = 800;
                    const max_height = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > max_width) {
                            height *= max_width / width;
                            width = max_width;
                        }
                    } else {
                        if (height > max_height) {
                            width *= max_height / height;
                            height = max_height;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Output optimized JPEG under 70% compression parameter
                    const base64jpeg = canvas.toDataURL('image/jpeg', 0.7);
                    currentCompressedImageBase64 = base64jpeg;
                    
                    // Trigger WhatsApp-style Preview Modal
                    openImagePreview(base64jpeg);
                    input.value = ''; // Reset input element
                };
            };
        }

        function openImagePreview(src) {

                let list = [];
                snapshot.forEach(child => {

                list.reverse();

                if (list.length === 0) {
                    stream.innerHTML = `<p class="text-sm text-slate-500 py-8 text-center">No announcements broadcasted yet.</p>`;

                    document.getElementById('ann-content-input').value = '';

        // TARGETS MULTISELECT CONTROLS
        let selectedTargetAccounts = [];

        function populateTargetsDropdown() {
            const dropdown = document.getElementById('target-multiselect-dropdown');
            db.ref('users').once('value', snapshot => {
                dropdown.innerHTML = '';
                
                // Add All Employees trigger checkbox
                const labelAll = document.createElement('label');
                labelAll.className = "flex items-center gap-2 text-xs font-bold text-accent";
                labelAll.innerHTML = `<input type="checkbox" value="all" onchange="handleTargetCheckboxChange(this)"> * ALL EMPLOYEES *`;
                dropdown.appendChild(labelAll);

                let accounts = new Set();
                snapshot.forEach(child => {
                    const u = child.val();
                    if (u.account && u.account !== 'Default') {
                        accounts.add(u.account);
                    }
                });

                accounts.forEach(acc => {
                    const label = document.createElement('label');
                    label.className = "flex items-center gap-2 text-xs text-slate-200";
                    label.innerHTML = `<input type="checkbox" value="${acc}" onchange="handleTargetCheckboxChange(this)"> ${acc}`;
                    dropdown.appendChild(label);
                });
            });
        }

        function toggleMultiSelectDropdown() {
            const drop = document.getElementById('target-multiselect-dropdown');
            drop.style.display = drop.style.display === 'block' ? 'none' : 'block';
        }

        function handleTargetCheckboxChange(checkbox) {
            const val = checkbox.value;
            if (val === 'all') {
                if (checkbox.checked) {
                    selectedTargetAccounts = ['all'];
                    // Uncheck other checkboxes
                    document.querySelectorAll('#target-multiselect-dropdown input').forEach(cb => {
                        if (cb.value !== 'all') cb.checked = false;
                    });
                } else {
                    selectedTargetAccounts = [];
                }
            } else {
                // If checking campaign, uncheck 'all'
                const cbAll = document.querySelector('#target-multiselect-dropdown input[value="all"]');
                if (cbAll) cbAll.checked = false;
                selectedTargetAccounts = selectedTargetAccounts.filter(v => v !== 'all');

                if (checkbox.checked) {
                    selectedTargetAccounts.push(val);
                } else {
                    selectedTargetAccounts = selectedTargetAccounts.filter(v => v !== val);
                }
            }

            // Update Label text representation
            const label = document.getElementById('selected-targets-label');
            if (selectedTargetAccounts.length === 0) {
                label.innerText = 'Select accounts...';
            } else if (selectedTargetAccounts.includes('all')) {
                label.innerText = 'All Employees';
            } else {
                label.innerText = selectedTargetAccounts.join(', ');
            }
        }

        // Close dropdown when clicking outside
        window.addEventListener('click', e => {
            const dropdown = document.getElementById('target-multiselect-dropdown');
            const toggle = document.querySelector('[onclick="toggleMultiSelectDropdown()"]');
            if (dropdown && !dropdown.contains(e.target) && toggle && !toggle.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        // QUESTION STACK ADDITIONS
        function addPendingQuestion() {
            const qInput = document.getElementById('quiz-question-input');
            const o1 = document.getElementById('quiz-opt-1');
            const o2 = document.getElementById('quiz-opt-2');
            const o3 = document.getElementById('quiz-opt-3');
            const o4 = document.getElementById('quiz-opt-4');
            const correctVal = parseInt(document.getElementById('quiz-opt-correct').value);

            if (!qInput.value.trim() || !o1.value.trim() || !o2.value.trim() || !o3.value.trim() || !o4.value.trim() || isNaN(correctVal) || correctVal < 1 || correctVal > 4) {
                alert('Please build a complete question with valid options and correct answer value.');
                return;
            }

            pendingQuizQuestions.push({
                questionText: qInput.value.trim(),
                options: [o1.value.trim(), o2.value.trim(), o3.value.trim(), o4.value.trim()],
                correctOptionIndex: correctVal - 1
            });

            // Update counter display
            document.querySelector('#pending-questions-counter b').innerText = pendingQuizQuestions.length;

            // Clear input fields
            qInput.value = '';
            o1.value = ''; o2.value = ''; o3.value = ''; o4.value = '';
            document.getElementById('quiz-opt-correct').value = '';
        }

        // SAVE & PUBLISH FINAL QUIZ
        function saveConstructedQuiz() {
            const title = document.getElementById('quiz-title-input').value.trim();
            if (!title) {
                alert('Please specify quiz title!');
                return;
            }
            if (pendingQuizQuestions.length === 0) {
                alert('Please add at least one question to the quiz structure.');
                return;
            }
            if (selectedTargetAccounts.length === 0) {
                alert('Please target at least one account/campaign or all employees.');
                return;
            }

            const payload = {
                title: title,
                targets: selectedTargetAccounts,
                questions: pendingQuizQuestions,
                timestamp: Date.now()
            };

            db.ref('quizzes').push(payload)
                .then(() => {
                    alert('Quiz published successfully! 🎉');
                    // Reset State
                    document.getElementById('quiz-title-input').value = '';
                    pendingQuizQuestions = [];
                    selectedTargetAccounts = [];
                    document.querySelector('#pending-questions-counter b').innerText = '0';
                    document.getElementById('selected-targets-label').innerText = 'Select accounts...';
                    document.querySelectorAll('#target-multiselect-dropdown input').forEach(cb => cb.checked = false);
                });
        }

        function closeQuizEditingWorkspace() {

        function removeQuestionFromEditBoard(quizId, qIndex) {
            if (confirm(`Do you wish to remove Question ${qIndex + 1}? Please apply changes to finalize.`)) {
                event.target.closest('.question-editor-item').remove();
            }
        }

        function insertQuickQuestionToEditWorkspace(quizId) {
            const text = document.getElementById('quick-add-q-text').value.trim();
            const o0 = document.getElementById('quick-add-o0').value.trim();
            const o1 = document.getElementById('quick-add-o1').value.trim();
            const o2 = document.getElementById('quick-add-o2').value.trim();
            const o3 = document.getElementById('quick-add-o3').value.trim();
            const correct = parseInt(document.getElementById('quick-add-correct').value);

            if (!text || !o0 || !o1 || !o2 || !o3 || isNaN(correct) || correct < 1 || correct > 4) {
                alert('Please build a valid quick question complete with 4 options.');
                return;
            }

            // Retrieve current database quiz structure first
            db.ref(`quizzes/${quizId}/questions`).once('value', snapshot => {
                let list = snapshot.val() || [];
                list.push({
                    questionText: text,
                    options: [o0, o1, o2, o3],
                    correctOptionIndex: correct - 1
                });
                db.ref(`quizzes/${quizId}/questions`).set(list).then(() => {
                    loadQuizToEdit(quizId); // Refresh editing container
                });
            });
        }

        function submitQuizChanges(quizId) {
            const title = document.getElementById('edit-quiz-title').value.trim();
            if (!title) {
                alert('Title cannot be empty!');
                return;
            }

            let questions = [];
            document.querySelectorAll('.question-editor-item').forEach(el => {
                const text = el.querySelector('.q-text-val').value.trim();
                const o0 = el.querySelector('.opt0-val').value.trim();
                const o1 = el.querySelector('.opt1-val').value.trim();
                const o2 = el.querySelector('.opt2-val').value.trim();
                const o3 = el.querySelector('.opt3-val').value.trim();
                const correct = parseInt(el.querySelector('.correct-val').value) - 1;

                if (text && o0 && o1 && o2 && o3 && !isNaN(correct)) {
                    questions.push({
                        questionText: text,
                        options: [o0, o1, o2, o3],
                        correctOptionIndex: correct
                    });
                }
            });

            if (questions.length === 0) {
                alert('Your quiz must hold at least one question entry.');
                return;
            }

            db.ref('quizzes/' + quizId + '/title').set(title);
            db.ref('quizzes/' + quizId + '/questions').set(questions)
                .then(() => {
                    alert('All changes saved successfully! 🎉');
                    closeQuizEditingWorkspace();
                    loadPlatformQuizzes();
                });
        }


        // ==========================================
        // 7. ISOLATED QUIZ ATTEMPT INTERFACE (DISTRACTION FREE)
        // ==========================================
        let activeAttemptingQuizId = null;
        let activeAttemptingQuestions = [];

        function startIsolatedQuizAttempt(quizId) {
            activeAttemptingQuizId = quizId;
            const body = document.getElementById('isolated-quiz-body');
            body.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-accent"></i> Preparing questions...</div>`;
            
            // Show isolated full screen layer
            document.getElementById('isolated-quiz-container').classList.remove('hidden');

            db.ref('quizzes/' + quizId).once('value', snapshot => {
                const quiz = snapshot.val();
                if (!quiz) {
                    exitQuizMode();
                    return;
                }

                document.getElementById('isolated-quiz-title').innerText = quiz.title;
                activeAttemptingQuestions = quiz.questions || [];

                let streamHTML = `
                    <div class="card p-4 rounded-lg bg-slate-900 border-l-4 border-accent text-slate-300 text-sm">
                        <b>Instructions:</b> Read all questions carefully before submitting. Ensure your internet connection is stable.
                    </div>
                `;

                activeAttemptingQuestions.forEach((q, index) => {
                    streamHTML += `
                        <div class="card p-6 rounded-lg flex flex-col gap-4 quiz-question-block" data-q-index="${index}">
                            <h3 class="font-bold text-slate-100 flex gap-2"><span class="text-accent font-mono">${index + 1}.</span> ${q.questionText}</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <label class="flex items-center gap-3 bg-slate-950 p-3 rounded-lg border border-slate-800 cursor-pointer hover:bg-slate-900 transition">
                                    <input type="radio" name="q_opt_${index}" value="0" class="accent-yellow-500">
                                    <span class="text-sm text-slate-300">${q.options[0]}</span>
                                </label>
                                <label class="flex items-center gap-3 bg-slate-950 p-3 rounded-lg border border-slate-800 cursor-pointer hover:bg-slate-900 transition">
                                    <input type="radio" name="q_opt_${index}" value="1" class="accent-yellow-500">
                                    <span class="text-sm text-slate-300">${q.options[1]}</span>
                                </label>
                                <label class="flex items-center gap-3 bg-slate-950 p-3 rounded-lg border border-slate-800 cursor-pointer hover:bg-slate-900 transition">
                                    <input type="radio" name="q_opt_${index}" value="2" class="accent-yellow-500">
                                    <span class="text-sm text-slate-300">${q.options[2]}</span>
                                </label>
                                <label class="flex items-center gap-3 bg-slate-950 p-3 rounded-lg border border-slate-800 cursor-pointer hover:bg-slate-900 transition">
                                    <input type="radio" name="q_opt_${index}" value="3" class="accent-yellow-500">
                                    <span class="text-sm text-slate-300">${q.options[3]}</span>
                                </label>
                            </div>
                        </div>
                    `;
                });

                streamHTML += `
                    <button onclick="submitQuizAttemptAnswers()" class="accent-btn py-3 rounded-lg font-bold uppercase tracking-wider text-sm flex items-center justify-center gap-2 mt-4"><i class="fa-solid fa-paper-plane"></i> Submit Answers</button>
                `;

                body.innerHTML = streamHTML;
            });
        }

        function exitQuizMode() {
            document.getElementById('isolated-quiz-container').classList.add('hidden');
            activeAttemptingQuizId = null;
            activeAttemptingQuestions = [];
        }

        function submitQuizAttemptAnswers() {
            let answers = [];
            let unassignedCount = 0;

            activeAttemptingQuestions.forEach((q, index) => {
                const radio = document.querySelector(`input[name="q_opt_${index}"]:checked`);
                if (radio) {
                    answers.push(parseInt(radio.value));
                } else {
                    answers.push(-1); // Skipped/unanswered
                    unassignedCount++;
                }
            });

            if (unassignedCount > 0) {
                if (!confirm(`You missed ${unassignedCount} questions. Proceed anyway?`)) {
                    return;
                }
            }

            // Calculate final percentage immediately
            let correctCounter = 0;
            activeAttemptingQuestions.forEach((q, index) => {
                if (answers[index] === q.correctOptionIndex) {
                    correctCounter++;
                }
            });

            const finalScore = Math.round((correctCounter / activeAttemptingQuestions.length) * 100);

            // Record parameters to firebase database storage node
            const payload = {
                fullName: currentUser.fullName,
                username: currentUser.username,
                hrId: currentUser.hrId,
                account: currentUser.account,
                timestamp: Date.now(),
                answers: answers,
                score: finalScore
            };

            db.ref(`quiz_results/${activeAttemptingQuizId}/${currentUser.username}`).set(payload)
                .then(() => {
                    displayAttemptResultsOnboard(finalScore, answers);
                });
        }

        function displayAttemptResultsOnboard(score, userAnswers) {
            const body = document.getElementById('isolated-quiz-body');
            
            let html = `
                <div class="card p-6 rounded-lg bg-slate-900 flex flex-col items-center justify-center gap-3 text-center border-b-4 ${score >= 50 ? 'border-emerald-500' : 'border-red-500'}">
                    <span class="text-xs uppercase text-slate-400">Quiz Submitted Successfully</span>
                    <h3 class="text-xl font-bold">Your Total Performance Score</h3>
                    <div class="text-5xl font-black ${score >= 50 ? 'text-emerald-400' : 'text-red-400'} font-mono">${score}%</div>
                    <p class="text-sm text-slate-300 mt-2">Review your submitted answer report below.</p>
                </div>
            `;

            activeAttemptingQuestions.forEach((q, index) => {
                const userAns = userAnswers[index];
                const correctAns = q.correctOptionIndex;
                const isCorrect = userAns === correctAns;

                html += `
                    <div class="card p-5 rounded-lg flex flex-col gap-2 bg-slate-900 border-l-4 ${isCorrect ? 'border-emerald-500' : 'border-red-500'}">
                        <span class="text-[10px] font-bold uppercase ${isCorrect ? 'text-emerald-400' : 'text-red-400'}">${isCorrect ? 'Correct ✅' : 'Incorrect ❌'}</span>
                        <h4 class="text-slate-100 font-semibold text-sm">${index + 1}. ${q.questionText}</h4>
                        <div class="flex flex-col gap-1.5 text-xs mt-1">
                            <div class="p-2 rounded ${isCorrect ? 'bg-emerald-950/40 text-emerald-300 border border-emerald-800' : 'bg-red-950/40 text-red-300 border border-red-800'}">
                                <b>Your Answer:</b> ${userAns !== -1 ? q.options[userAns] : '[ Skipped ]'}
                            </div>
                            ${!isCorrect ? `
                                <div class="p-2 rounded bg-slate-950 text-slate-300 border border-slate-800">
                                    <b>Correct Answer:</b> ${q.options[correctAns]}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            html += `
                <button onclick="exitQuizMode()" class="bg-accent hover:bg-yellow-600 text-slate-950 font-black py-3 rounded-lg text-sm uppercase flex items-center justify-center gap-2 mt-2"><i class="fa-solid fa-arrow-left"></i> Return to Dashboard</button>
            `;

            body.innerHTML = html;
        }

        // ==========================================
        // 8. EXCEL RESULTS EXPORT SYSTEM
        // ==========================================
        function exportQuizResultsToExcel(quizId, quizTitle) {
            // Retrieve both Quiz metadata questions and results object data from firebase
            db.ref('quizzes/' + quizId).once('value', qSnap => {
                const quiz = qSnap.val();
                if (!quiz) return;

                db.ref('quiz_results/' + quizId).once('value', rSnap => {
                    const results = rSnap.val() || {};

                    const questions = quiz.questions || [];
                    
                    // Create basic spreadsheet headers
                    let headers = ["Full Name", "HR ID", "Account", "Date Submitted"];
                    questions.forEach((q, qIndex) => {
                        headers.push(`Question ${qIndex + 1}: ${q.questionText}`);
                    });
                    headers.push("Score (%)");

                    let rowData = [headers];

                    // Map all responses
                    Object.values(results).forEach(res => {
                        let row = [
                            res.fullName,
                            res.hrId,
                            res.account,
                            new Date(res.timestamp).toLocaleString()
                        ];

                        questions.forEach((q, qIndex) => {
                            const ansIndex = res.answers ? res.answers[qIndex] : -1;
                            if (ansIndex === -1) {
                                row.push(`❌ Skipped (Correct: ${q.options[q.correctOptionIndex]})`);
                            } else if (ansIndex === q.correctOptionIndex) {
                                row.push(`✅ ${q.options[ansIndex]}`);
                            } else {
                                row.push(`❌ ${q.options[ansIndex]} (Correct: ${q.options[q.correctOptionIndex]})`);
                            }
                        });

                        row.push(`${res.score}%`);
                        rowData.push(row);
                    });

                    // Build SheetJS Workbook
                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.aoa_to_sheet(rowData);

                    // Apply layout widths
                    const wscols = [
                        {wch: 25}, // Full Name
                        {wch: 15}, // HR ID
                        {wch: 15}, // Account
                        {wch: 22}, // Date
                    ];
                    questions.forEach(() => {
                        wscols.push({wch: 40}); // Questions columns wide
                    });
                    wscols.push({wch: 12}); // Score
                    ws['!cols'] = wscols;

                    XLSX.utils.book_append_sheet(wb, ws, "Quiz Performance Report");
                    
                    // Export trigger file download
                    XLSX.writeFile(wb, `${quizTitle.replace(/[/\\?%*:|"<>\s]/g, '_')}_Results_Report.xlsx`);
                });
            });
        }
    </script>
</body>
</html>
